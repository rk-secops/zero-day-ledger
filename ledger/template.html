<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Zero-Day Ledger</title>
<meta name="description" content="A daily, typewritten digest of the top cybersecurity headlines from $wire_count news wires.">
<link rel="canonical" href="https://thezerodayledger.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thezerodayledger.com/">
<meta property="og:title" content="The Zero-Day Ledger">
<meta property="og:description" content="All the exploits fit to patch. Today's top cybersecurity headlines from $wire_count news wires, set in type every morning.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="style.css">
<script src="typewriter.js" defer></script>
</head>
<body>

<svg id="grain" aria-hidden="true" focusable="false">
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#noise)"/>
</svg>

<div class="sheet">
  <header class="masthead">
    <p class="kicker">Printed fresh &middot; Vol. I &middot; No. $issue</p>
    <h1 class="title">The <span class="nowrap">Zero-Day</span> Ledger</h1>
    <p class="subhead">&ldquo;All the exploits fit to patch&rdquo;</p>
    <hr class="masthead-rule">
    <div class="dateline">
      <time datetime="$built_iso">$built_date</time>
      <span>$wire_status</span>
    </div>
  </header>

  <main>
$kev
$dispatches
  </main>

  <footer class="colophon">
    <p>Set in type at $built_time UTC from $wire_count news wires.<br>Comes off the press every morning.</p>
    $down_notice
    <p class="stamp">&mdash; END OF TRANSMISSION &mdash;</p>
  </footer>
</div>

</body>
</html>
