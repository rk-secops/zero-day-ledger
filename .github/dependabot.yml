# Weekly PRs to bump the pinned action SHAs and the anthropic SDK.
# (wranglerVersion in press.yml is an npm version string; bump it by hand.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
