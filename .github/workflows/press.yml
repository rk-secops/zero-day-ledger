name: Press run

on:
  schedule:
    # 11:00 UTC = 7:00 AM Eastern in summer, 6:00 AM in winter.
    - cron: "0 11 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: press-run
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Build today's edition
        run: python3 ledger/build.py
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Exact version: the action defaults to Wrangler 3 (no assets-only Workers),
          # and a floating "4" would pull whatever npm serves that morning.
          wranglerVersion: "4.152.0"
          command: deploy
