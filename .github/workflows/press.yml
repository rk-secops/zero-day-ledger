name: Press run

on:
  schedule:
    # 11:00 UTC = 7:00 AM Eastern in summer, 6:00 AM in winter.
    - cron: "0 11 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: press-run
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build today's edition
        run: python3 ledger/build.py
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action defaults to Wrangler 3, which can't deploy an assets-only Worker.
          wranglerVersion: "4"
          command: deploy
