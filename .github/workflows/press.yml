name: Press run

on:
  schedule:
    # 11:00 UTC = 7:00 AM Eastern in summer, 6:00 AM in winter.
    - cron: "0 11 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: press-run
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies (hash-verified)
        run: python3 -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements.txt
      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies (hash-verified)
        run: python3 -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements.txt
      - name: Build today's edition
        env:
          # Scoped to this step only; if the secret is missing, the build
          # keeps the feed blurbs.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 ledger/build.py
      - name: Install Wrangler (hash-verified)
        # package-lock.json pins Wrangler and every package under it by integrity
        # hash; --ignore-scripts keeps install hooks out of the job that holds
        # the Cloudflare token.
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # No wranglerVersion: the action uses the Wrangler installed above, so
          # the version lives in package.json and Dependabot keeps it current.
          command: deploy
