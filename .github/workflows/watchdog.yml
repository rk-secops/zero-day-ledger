name: Watchdog

# Checks the live site every 6 hours. A failed run means visitors are getting
# something this repo didn't deploy (changed headers, injected script, stale
# edition, expiring certificate); GitHub emails on failed scheduled runs.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the live site
        run: python3 tools/watchdog.py
