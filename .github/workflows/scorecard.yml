name: Scorecard

# OpenSSF Scorecard: grades this repo's supply-chain security practices,
# publishes the result for the README badge, and uploads findings to the
# Security tab. Runs weekly and when branch protection changes.
on:
  branch_protection_rule:
  schedule:
    - cron: "41 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload results to the Security tab
      id-token: write         # publish results for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d # v4.39.1
        with:
          sarif_file: results.sarif
